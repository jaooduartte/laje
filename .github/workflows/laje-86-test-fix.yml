name: LAJE-86 Test Fix

on:
  push:
    branches:
      - LAJE-86

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: LAJE-86

      - name: Isolate W.O. save refetch assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/admin/AdminMatches.scoreSheetReview.test.tsx")
          content = path.read_text()

          replacements = [
              (
                  "    onRefetch.mockClear();\n    onRefetchChampionshipBracket.mockClear();\n\n    expect(screen.getByRole(\"combobox\", { name: \"W.O.?\" })).toHaveTextContent(",
                  "    expect(screen.getByRole(\"combobox\", { name: \"W.O.?\" })).toHaveTextContent(",
              ),
              (
                  "    fireEvent.click(await screen.findByRole(\"option\", { name: \"W.O. VISITANTE\" }));\n    fireEvent.click(screen.getByRole(\"button\", { name: \"Salvar alterações\" }));",
                  "    fireEvent.click(await screen.findByRole(\"option\", { name: \"W.O. VISITANTE\" }));\n\n    onRefetch.mockClear();\n    onRefetchChampionshipBracket.mockClear();\n\n    fireEvent.click(screen.getByRole(\"button\", { name: \"Salvar alterações\" }));",
              ),
              (
                  "    expect(onRefetch).toHaveBeenCalledTimes(1);\n    expect(onRefetchChampionshipBracket).toHaveBeenCalled();",
                  "    expect(onRefetch).toHaveBeenCalledTimes(1);\n    expect(onRefetchChampionshipBracket).toHaveBeenCalledTimes(1);",
              ),
          ]

          for old, new in replacements:
              if old not in content:
                  raise SystemExit(f"Expected target was not found: {old!r}")
              content = content.replace(old, new, 1)

          path.write_text(content)
          PY

      - name: Commit test fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminMatches.scoreSheetReview.test.tsx
          git commit -m "LAJE-86: isolar refetch no teste de W.O."
          git push origin HEAD:LAJE-86
