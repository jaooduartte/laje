name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      coverage_result: ${{ steps.frontend_coverage.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: LAJE-150 inspect formatting
        run: |
          npx prettier src/domain/championship-brackets/championshipBracket.repository.ts --write
          git diff -- src/domain/championship-brackets/championshipBracket.repository.ts
          npx prettier docs/quality/observability-aws.md src/lib/observability.test.ts src/lib/observability.ts --write
          git diff -- docs/quality/observability-aws.md src/lib/observability.test.ts src/lib/observability.ts

      - name: Check formatting
        run: npm run format:check

      - name: Smoke tests for three business flows
        run: npm run test:smoke

      - name: Measure frontend coverage (25% line threshold)
        id: frontend_coverage
        run: npm run test:coverage

      - name: Validate frontend LCOV report
        run: |
          test -s coverage/frontend/lcov.info
          grep -q '^SF:' coverage/frontend/lcov.info
          grep -q '^end_of_record' coverage/frontend/lcov.info

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laje-frontend-coverage
          path: coverage/frontend/
          if-no-files-found: warn
          retention-days: 30

      - name: Build legacy/Supabase-compatible bundle
        run: npm run build

      - name: Build AWS-only bundle
        env:
          VITE_BACKEND_PROVIDER: aws
          VITE_API_URL: https://example.invalid/api/v1
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
        run: npm run build

      - name: Validate SonarQube Cloud project variables
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.fork == false) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Set the SONAR_ORGANIZATION repository variable."; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Set the SONAR_PROJECT_KEY repository variable."; exit 1; }

      - name: SonarQube Cloud analysis
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.fork == false) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

  coverage-comment:
    name: Publish Coverage Summary
    needs: quality-gate
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Download frontend coverage report
        if: always() && (needs.quality-gate.outputs.coverage_result == 'success' || needs.quality-gate.outputs.coverage_result == 'failure')
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: laje-frontend-coverage
          path: coverage/frontend/

      - name: Create or update coverage comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COVERAGE_RESULT: ${{ needs.quality-gate.outputs.coverage_result }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");
            const marker = "<!-- laje-web-coverage-summary -->";
            const summaryPath = "coverage/frontend/coverage-summary.json";
            const threshold = 25;
            const resultLabels = {
              success: "✅ aprovado",
              failure: "❌ falhou",
              cancelled: "⏹️ cancelado",
              skipped: "⏭️ não executado",
            };
            const result = process.env.COVERAGE_RESULT || "skipped";
            const formatMetric = (label, metric, minimum) => {
              if (
                !metric ||
                !Number.isFinite(metric.pct) ||
                metric.pct < 0 ||
                metric.pct > 100 ||
                !Number.isSafeInteger(metric.covered) ||
                metric.covered < 0 ||
                !Number.isSafeInteger(metric.total) ||
                metric.total < 0
              ) {
                return `- **${label}:** indisponível`;
              }

              const percentage = metric.pct.toLocaleString("pt-BR", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              });
              const counts = `${metric.covered.toLocaleString("pt-BR")}/${metric.total.toLocaleString("pt-BR")}`;
              const thresholdLabel = minimum === undefined
                ? ""
                : ` — mínimo ${minimum}% ${metric.pct >= minimum ? "atingido" : "não atingido"}`;

              return `- **${label}:** ${percentage}% (${counts})${thresholdLabel}`;
            };

            let reportLines = ["Relatório de cobertura indisponível. Consulte o job Quality Gate."];
            try {
              const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
              reportLines = [
                formatMetric("Linhas", summary.total?.lines, threshold),
                formatMetric("Branches", summary.total?.branches),
                formatMetric("Funções", summary.total?.functions),
              ];
            } catch {}

            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const body = [
              marker,
              "## 📊 Cobertura dos testes — Web",
              "",
              `**Resultado da cobertura:** ${resultLabels[result] || "⚠️ indisponível"}`,
              "",
              ...reportLines,
              "",
              `[Ver execução da CI](https://github.com/${owner}/${repo}/actions/runs/${process.env.RUN_ID}) · Commit: \`${pullRequest.head.sha.slice(0, 7)}\``,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existingComment = comments.find((comment) => comment.body?.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              });
            }
