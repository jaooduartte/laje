name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: LAJE-150 resolve dependency lock for security patch
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'LOCK_DIAGNOSTIC'
          import fs from "node:fs";
          import {execFileSync} from "node:child_process";
          const prev = JSON.parse(execFileSync("git", ["show", "HEAD:package-lock.json"], {encoding:"utf8"}));
          const updated = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const changes = Object.keys(updated.packages).filter(k=>JSON.stringify(prev.packages[k])!==JSON.stringify(updated.packages[k])).map(k=>({key:k,value:updated.packages[k]}));
          console.log("LAJE150_LOCK_DIFF " + JSON.stringify({root:updated.packages[""],entries:changes}));
          LOCK_DIAGNOSTIC

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Smoke tests for three business flows
        run: npm run test:smoke

      - name: Measure frontend coverage (25% line threshold)
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laje-frontend-coverage
          path: coverage/frontend/
          if-no-files-found: warn
          retention-days: 30

      - name: Build legacy/Supabase-compatible bundle
        run: npm run build

      - name: Build AWS-only bundle
        env:
          VITE_BACKEND_PROVIDER: aws
          VITE_API_URL: https://example.invalid/api/v1
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
        run: npm run build
