name: LAJE-145 Tailwind 4 Isolated Compatibility Preview
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/laje145-tailwind4-spike.yml
permissions:
  contents: read
jobs:
  spike:
    name: Test Tailwind 4 without committing UI changes
    if: github.head_ref == 'LAJE-145' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Reproduce current 5 high advisories
        shell: bash
        run: |
          npm ci
          set +e
          npm audit --json >/tmp/laje145-audit-before.json
          set -e
          node -e 'const x=require("/tmp/laje145-audit-before.json"); console.log("BASELINE_AUDIT="+JSON.stringify(x.metadata?.vulnerabilities))'
      - name: Prototype Tailwind 4 safely in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall --ignore-scripts lovable-tagger tailwindcss-animate
          npm install --save-dev --ignore-scripts tailwindcss@4.3.3 @tailwindcss/postcss@4.3.3 tw-animate-css@1.4.0
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          function edit(file, from, to) {
            const original=readFileSync(file, "utf8");
            if(!original.includes(from))throw new Error("Missing expected token in "+file+": "+from);
            writeFileSync(file, original.replace(from,to));
          }
          edit("vite.config.ts", 'import { componentTagger } from "lovable-tagger";\n',"");
          edit("vite.config.ts", 'plugins: [react(), mode === "development" && componentTagger()].filter(Boolean)',"plugins: [react()]");
          edit("tailwind.config.ts", 'import type { Config } from "tailwindcss";\n',"");
          edit("tailwind.config.ts", 'import tailwindcssAnimate from "tailwindcss-animate";\n',"");
          edit("tailwind.config.ts", "plugins: [tailwindcssAnimate]", "plugins: []");
          edit("tailwind.config.ts", "} satisfies Config;", "};");
          edit("postcss.config.js", "tailwindcss: {}", '"@tailwindcss/postcss": {}');
          edit("src/index.css", "@tailwind base;\n@tailwind components;\n@tailwind utilities;", '@import "tailwindcss";\n@import "tw-animate-css";\n@config "../tailwind.config.ts";\n@custom-variant dark (&:where(.dark, .dark *));');
          NODE
          npm ci
      - name: Report vulnerabilities and dependency graph
        shell: bash
        run: |
          set +e
          npm audit --json >/tmp/laje145-audit-tailwind4.json
          status=$?
          set -e
          node -e 'const x=require("/tmp/laje145-audit-tailwind4.json"); console.log("TAILWIND4_AUDIT="+JSON.stringify(x.metadata?.vulnerabilities||x.error)); for(const [name,v] of Object.entries(x.vulnerabilities||{})){if(["high","critical"].includes(v.severity))console.log("TAILWIND4_SEVERE="+name+" "+v.severity)}'
          echo "audit_exit=$status"
      - name: Validate scripts, component classes and CSS output
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm run test:smoke
          npm run build
          npm run build:dev
          node --input-type=module <<'NODE'
          import {readdirSync, readFileSync, statSync} from "node:fs";
          const assets=readdirSync("dist/assets").filter(name=>name.endsWith(".css"));
          const output=assets.map(file=>readFileSync("dist/assets/"+file,"utf8")).join("");
          console.log("TAILWIND4_CSS_BYTES="+Buffer.byteLength(output));
          for(const name of ["bg-primary","text-foreground","border-border","dark","animate-in","accordion-down"]){
            const found=output.includes(name);
            console.log("TAILWIND4_UTILITY="+name+" found="+found);
            if(!found)process.exitCode=1;
          }
          NODE
