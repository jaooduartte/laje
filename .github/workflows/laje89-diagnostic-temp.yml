name: LAJE-89 read-only modality and banner audit (temporary)
on:
  push:
    branches:
      - LAJE-89-modality-banner
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe public API and Vercel UI (read only)
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          import re
          API="https://rkckaptyaf.execute-api.sa-east-1.amazonaws.com/api/v1"
          ids={"INTERLAJE":"c7718ca6-4447-4c20-a8ca-5781a34a3778","CLV":"5edbcb36-0864-4a7c-9e89-e72c27c3455f","SOCIETY":"17b92cf5-dd92-44eb-9295-b28000372e4b"}
          paths=[("settings","/public/settings"),("sports-all","/public-runtime/sports"),("championships","/sports-core/championships")]
          for name,id in ids.items(): paths.append((name,"/public-runtime/sports?championshipId="+id))
          for key,path in paths:
            req=urllib.request.Request(API+path,headers={"Accept":"application/json","User-Agent":"LAJE-89-readonly-audit"})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read().decode("utf-8");status=r.status
            except urllib.error.HTTPError as err:
              status=err.code;body=err.read().decode("utf-8")
            except Exception as err:
              print(key,"CONNECT_ERROR",type(err).__name__);continue
            try:data=json.loads(body);inner=data.get("data",data) if isinstance(data,dict) else data
            except Exception:inner={}
            if isinstance(inner,dict) and "sports" in inner:
              sports=inner.get("sports") or [];cs=inner.get("championshipSports") or []
              print(key,"status",status,"sports",[(x.get("name"),x.get("code")) for x in sports],"championshipSports",len(cs))
            elif key=="settings":
              if isinstance(inner,dict):
                print(key,"status",status,"announcement_active",bool(inner.get("announcementMessage") or inner.get("announcementContent") or inner.get("announcement_message") or inner.get("announcement_content")),"is_blocked",inner.get("isPublicAccessBlocked",inner.get("is_public_access_blocked")))
              else: print(key,"status",status,"kind",type(inner).__name__)
            else: print(key,"status",status,"shape",list(inner.keys())[:8] if isinstance(inner,dict) else type(inner).__name__)
          for site in ["https://ligadasatleticas.vercel.app","https://laje-tcc.vercel.app"]:
            for page in ["/ao-vivo","/agenda"]:
              req=urllib.request.Request(site+page,headers={"User-Agent":"LAJE-89-readonly-audit"})
              try:
                with urllib.request.urlopen(req,timeout=20) as r:status=r.status;body=r.read().decode("utf-8")
                print(site+page,"http",status,"html_bytes",len(body))
              except Exception as e: print(site+page,"error",type(e).__name__)
          PY
