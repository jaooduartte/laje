name: LAJE-89 staging endpoint smoke (temporary)
on:
  push:
    branches: [LAJE-89]
permissions:
  contents: read
jobs:
  staging-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed AWS API read-only snapshots
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          origin = "https://rkckaptyaf.execute-api.sa-east-1.amazonaws.com/api/v1"
          interlaje = "c7718ca6-4447-4c20-a8ca-5781a34a3778"
          clv = "5edbcb36-0864-4a7c-9e89-e72c27c3455f"
          sport = "906e409b-9ca8-44a0-99f8-14bbbda2ef5a"

          public = [
            ("health", "/health"),
            ("overall", f"/realtime-read/{interlaje}/interlaje-overall-standings?seasonYear=2026"),
            ("competition", f"/realtime-read/{interlaje}/interlaje-competition-standings?" + urlencode({"seasonYear":"2026","sportId":sport,"naipe":"MASCULINO"})),
            ("award-rankings", f"/realtime-read/{clv}/awards-rankings?seasonYear=2026"),
            ("corrected-groups", f"/realtime-read/{interlaje}/corrected-group-standings?seasonYear=2026"),
            ("tie-orders", f"/realtime-read/{interlaje}/resolved-tie-break-orders?seasonYear=2026"),
            ("discipline", f"/realtime-read/{interlaje}/yellow-card-discipline?seasonYear=2026"),
            ("position-points", f"/realtime-read/{interlaje}/interlaje-position-points?seasonYear=2026"),
            ("disqualifications", f"/realtime-read/{interlaje}/competition-disqualifications?seasonYear=2026"),
          ]
          private = [
            ("pending-awards-protected", f"/realtime-read/{clv}/pending-award-draws?seasonYear=2026"),
            ("pending-ties-protected", f"/realtime-read/{interlaje}/pending-tie-breaks"),
          ]
          validation = [
            ("invalid-uuid-rejected", "/realtime-read/not-a-uuid/awards-rankings?seasonYear=2026"),
            ("invalid-naipe-rejected", f"/realtime-read/{interlaje}/interlaje-competition-standings?seasonYear=2026&sportId={sport}&naipe=INVALID"),
          ]

          failed=[]
          def check(name,path,expect):
            url=origin+path
            req=Request(url,headers={"User-Agent":"laje-89-staging-smoke/1.0", "accept":"application/json"})
            try:
              with urlopen(req,timeout=32) as resp:
                status=resp.status
                raw=resp.read()
            except HTTPError as e:
              status=e.code
              raw=e.read()
            except (URLError,TimeoutError) as e:
              print(f"{name}: CONNECTION_ERROR {type(e).__name__}")
              failed.append(name)
              return
            try:
              body=json.loads(raw)
            except (ValueError,UnicodeDecodeError):
              body=None
            has_data=isinstance(body,dict) and "data" in body
            error_code=(body.get("error",{}).get("code") if isinstance(body,dict) and isinstance(body.get("error"),dict) else None)
            data_type=(type(body["data"]).__name__ if has_data else "-")
            print(f"{name}: HTTP={status} hasData={has_data} type={data_type} errorCode={error_code}")
            if status != expect or (expect==200 and name!="health" and not has_data):
              failed.append(name)

          for name,path in public:check(name,path,200)
          for name,path in private:check(name,path,401)
          for name,path in validation:check(name,path,422)
          if failed:
            print("FAILED CHECKS:",",".join(failed))
            sys.exit(1)
          print("LAJE-89 staging read-only API checks PASSED")
          PY
