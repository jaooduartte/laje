name: LAJE-86 Format Fix

on:
  push:
    branches:
      - LAJE-86

permissions:
  contents: write

jobs:
  format-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: LAJE-86

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed test
        run: npx prettier --write src/components/admin/AdminMatches.scoreSheetReview.test.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminMatches.scoreSheetReview.test.tsx
          git commit -m "LAJE-86: formatar teste de AdminMatches"
          git push origin HEAD:LAJE-86
