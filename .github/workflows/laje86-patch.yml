name: LAJE-86 Patch

on:
  push:
    branches:
      - LAJE-86
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laje-86-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix dedicated API operational context
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/hooks/useMatches.ts")
          text = path.read_text()
          marker = "!shouldUseDedicatedSportsCore &&\n            includeOperationalContext"
          if marker not in text:
              raise SystemExit("Dedicated operational-context condition not found")
          text = text.replace(marker, "includeOperationalContext", 1)
          path.write_text(text)
          PY
          npx prettier \
            src/hooks/useMatches.ts \
            src/hooks/useChampionships.ts \
            src/hooks/useStandings.ts \
            src/hooks/useChampionshipBracket.ts \
            src/integrations/laje-api/sports-core.ts \
            src/integrations/laje-api/sports-core.test.ts \
            src/integrations/laje-api/bracket.ts \
            --write
      - name: Validate LAJE-86 frontend
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test -- --run
          npm run build
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/hooks/useMatches.ts \
            src/hooks/useChampionships.ts \
            src/hooks/useStandings.ts \
            src/hooks/useChampionshipBracket.ts \
            src/integrations/laje-api/sports-core.ts \
            src/integrations/laje-api/sports-core.test.ts \
            src/integrations/laje-api/bracket.ts
          git commit -m "LAJE-86 fix dedicated sports core integration"
          git push origin HEAD:LAJE-86
